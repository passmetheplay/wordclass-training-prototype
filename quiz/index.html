function sanitizeRows(){const unique=new Map();for(const w of st.rows){const en=w.en.trim().toLowerCase().replace(/\s+/g,' ');if(!w.include||!validWord(en))continue;unique.set(en,{en,cn:w.cn.trim()||wordMap.get(en)||'待补释义',include:true});}return [...unique.values()];}

function clearReadAudio(){
  const capture=readCapture;
  readCapture=null;
  if(capture?.recorder?.state==='recording')capture.recorder.stop();
  capture?.stream?.getTracks().forEach(track=>track.stop());
  readPlayer?.pause();
  readPlayer=null;
  if(readAudioUrl)URL.revokeObjectURL(readAudioUrl);
  readAudioUrl='';
}
async function recordRead(){
  if(readCapture?.recorder?.state==='recording'){
    readCapture.recorder.stop();
    render();
    return;
  }
  if(readCapture)return;
  stop();
  clearReadAudio();
  st.readTry=0;
  st.readFallback=false;
  st.notice='';
  const capture={};
  readCapture=capture;
  render();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(readCapture!==capture){stream.getTracks().forEach(track=>track.stop());return;}
    capture.stream=stream;
    const recorder=new MediaRecorder(stream);
    capture.recorder=recorder;
    const chunks=[];
    recorder.addEventListener('dataavailable',event=>{if(event.data.size)chunks.push(event.data);});
    recorder.addEventListener('stop',()=>{
      stream.getTracks().forEach(track=>track.stop());
      if(readCapture!==capture)return;
      readCapture=null;
      if(!chunks.length){st.readFallback=true;notify('没有录到声音，请重试。');return;}
      readAudioUrl=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType}));
      st.readTry=1;
      render();
    });
    recorder.addEventListener('error',()=>{
      if(readCapture!==capture)return;
      clearReadAudio();
      st.readFallback=true;
      notify('录音中断，可以重试或查看示例评分。');
    });
    recorder.start();
    render();
  }catch{
    if(readCapture!==capture)return;
    clearReadAudio();
    st.readFallback=true;
    notify('无法使用麦克风，可以听标准发音或查看示例评分。');
  }
}

function selectPair(id){
  const [side,i]=id.split(':');

    stop();
    const chinese=st.gameMode==='audioEnglish';
    void say(st.gameWords[i][chinese?1:0],chinese?'zh-CN':'en-US');
  }
  if(!st.pair||st.pair.split(':')[0]===side){st.pair=id;st.notice='';render();return;}
  if(st.pair.split(':')[1]===i){
    st.matched.add(st.boardStart+Number(i));
    st.gameStreak++;
    st.gameBest=Math.max(st.gameBest,st.gameStreak);
    st.notice=st.gameStreak>1?'连对 '+st.gameStreak+' 组':'配对成功！';
    if(st.matched.size===st.boardStart+st.gameWords.length){
      const round=st.round;
      setTimeout(()=>{
        if(st.page!=='exercise'||st.tool!=='game'||st.round!==round)return;
        if(st.matched.size===round.length){go('result');return;}
        newBoard(st.matched.size);
        st.notice='';
        render();
      },400);
    }
  }else{
    st.miss++;
    st.gameStreak=0;
    st.notice='这两张不匹配，再试试。';
  }
  st.pair=null;render();
}
async function speakCurrent(){
  const [en,cn]=current();
  if(st.dictMode==='en')return say(en);
  if(st.dictMode==='zh')return say(cn,'zh-CN');
  const id=playId, first=await say(cn,'zh-CN');
  if(id!==playId)return false;
  await wait(260);
  return id===playId&&await say(en)&&first;
}
function finishDictation(){
  stop();
  st.dictFinished=true;
  st.notice='';
  render();
}
async function autoSpeak(){
  if(st.active){stop();render();return;}
  stop();
  const id=playId;
  st.dictStarted=true;
  st.active=true;
  st.notice='';
  render();
  while(st.page==='exercise'&&playId===id){
    for(let j=0;j<st.repeats;j++){
      const success=await speakCurrent();
      if(playId!==id)return;
      if(!success){stop();notify('语音不可用，可手动切词或去核对。');return;}
      if(st.i===st.round.length-1&&j+1===st.repeats){finishDictation();return;}
      await wait(st.gap*1000);
      if(playId!==id)return;
    }
    st.i++;render();
  }
}
document.addEventListener('click',async event=>{
  const b=event.target.closest('button');if(!b||b.disabled)return;
  const d=b.dataset;
  if(d.dockOption){
    if(d.dockOption===dockLayout)return;
    dockLayout=d.dockOption;
    const url=new URL(location.href);
    url.searchParams.set('dock',dockLayout);
    history.replaceState(null,'',url);
    renderComparisonNav();
    if(st.tool==='dict'&&['exercise','check','result'].includes(st.page))render();else showPlayerPreview('ready');
    comparisonNav.querySelector(`[data-dock-option="${dockLayout}"]`)?.focus({preventScroll:true});
    return;
  }
  if(d.playerOption){
    if(d.playerOption===playerLayout)return;
    playerLayout=d.playerOption;
    const url=new URL(location.href);
    url.searchParams.set('player',playerLayout);
    history.replaceState(null,'',url);
    renderComparisonNav();
    if(st.tool==='dict'&&['exercise','check','result'].includes(st.page))render();else showPlayerPreview('ready');
    comparisonNav.querySelector(`[data-player-option="${playerLayout}"]`)?.focus({preventScroll:true});
    return;
  }
  if(d.playerState){showPlayerPreview(d.playerState);return;}
  if(d.unitStyle){
    if(d.unitStyle===bUnitStyle)return;
    bUnitStyle=d.unitStyle;
    const url=new URL(location.href);
    url.searchParams.set('unitStyle',bUnitStyle);
    history.replaceState(null,'',url);
    renderComparisonNav();
    if(st.page==='setup'&&st.tool==='dict')render();else setup('dict');
    comparisonNav.querySelector(`[data-unit-style="${bUnitStyle}"]`)?.focus({preventScroll:true});
    return;
  }
  if(d.layoutOption){
    if(d.layoutOption===dictLayout)return;
    dictLayout=d.layoutOption;
    const url=new URL(location.href);
    url.searchParams.set('layout',dictLayout);
    history.replaceState(null,'',url);
    st.inlineBook=false;
    renderComparisonNav();
    if(st.page==='setup'&&st.tool==='dict')render();else setup('dict');
    comparisonNav.querySelector(`[data-layout-option="${dictLayout}"]`)?.focus({preventScroll:true});
    return;
  }
  if(d.back!==undefined){go(({grade:'setup',term:'grade',setup:'home',exercise:'setup',check:'setup',result:'home',photo:st.photoBack,wrong:st.wrongBack})[st.page]||'home');return;}
  if(d.openBook!==undefined){openBook();return;}
  if(d.inlineBookToggle!==undefined){
    st.inlineBook=!st.inlineBook;
    render();
    view.querySelector('[data-inline-book-toggle]')?.focus({preventScroll:true});
    return;
  }
  if(d.bookGrade){
    if(d.bookGrade!==st.draftGrade)st.draftTerm=st.book.startsWith(d.bookGrade+'-')?st.book.split('-')[1]:'up';
    st.draftGrade=d.bookGrade;go('term');return;
  }
  if(d.bookTerm){st.draftTerm=d.bookTerm;render();return;}
  if(d.bookConfirm!==undefined){
    applyBook(st.draftGrade+'-'+st.draftTerm);
    go('setup');return;
  }
  if(d.nav){go(d.nav);return;}
  if(d.tool){
    if(d.tool==='photo'){st.photoBack='home';go('photo');}
    else setup(d.tool);
    return;
  }
  if(d.setupPhoto!==undefined){st.photoBack='setup';go('photo');return;}
  if(d.unit!==undefined){toggleUnit(+d.unit);return;}
  if(d.trainingUnit!==undefined){toggleTrainingUnit(+d.trainingUnit);return;}
  if(d.trainingExpand!==undefined){
    const index=Number(d.trainingExpand);
    if(st.expandedUnits.has(index))st.expandedUnits.delete(index);else st.expandedUnits.add(index);
    render();
    view.querySelector(`[data-training-expand="${index}"]`)?.focus({preventScroll:true});
    return;
  }
  if(d.source){
    if(st.source!==d.source){
      if(st.tool==='dict'&&st.source==='unit')st.dictUnitSelection=st.selected;
      st.source=d.source;
      st.selected=st.tool==='dict'&&st.source==='unit'?st.dictUnitSelection:new Set();
      render();
      view.querySelector(`[data-source="${d.source}"]`)?.focus({preventScroll:true});
    }
    return;
  }
  if(d.wrongExample!==undefined){
    for(const word of [['strict','严格的'],['weekend','周末'],['healthy','健康的']]){
      addWrong(word,'原型示例');
    }
    render();
    view.querySelector('[data-select]')?.focus({preventScroll:true});
    return;
  }
  if(d.all!==undefined||d.clear!==undefined){
    if(d.all!==undefined)choosePool();else st.selected.clear();
    render();document.querySelector(d.all!==undefined?'[data-clear]':'[data-all]')?.focus({preventScroll:true});return;
  }
  if(d.start!==undefined){initializeRound();return;}
  if(d.play==='dict'){void autoSpeak();return;}
  if(d.play==='restart'){
    st.i=0;
    st.dictFinished=false;
    void autoSpeak();
    return;
  }
  if(d.play==='one'){
    stop();
    const id=playId;
    render();
    const success=await speakCurrent();
    if(playId!==id)return;
    if(!success)notify('语音不可用，可以点「看答案」。');
    else if(st.i===st.round.length-1)finishDictation();
    return;
  }
  if(d.speak){
    stop();
    readPlayer?.pause();
    const id=playId;
    if(!await say(current()[0])&&playId===id)notify('当前浏览器的语音不可用。');
    return;
  }
  if(d.reveal!==undefined){st.dictAnswerVisible=!st.dictAnswerVisible;render();view.querySelector('[data-reveal]')?.focus({preventScroll:true});return;}
  if(d.move){move(st.i+Number(d.move));return;}
  if(d.favorite!==undefined){toggleFavorite();return;}
  if(d.recordRead!==undefined){void recordRead();return;}
  if(d.replayRead!==undefined&&readAudioUrl){
    stop();
    readPlayer?.pause();
    const player=new Audio(readAudioUrl);
    readPlayer=player;
    player.play().catch(()=>{if(readPlayer===player)notify('无法回听这段录音，可以重新录音。');});
    return;
  }
  if(d.readDemo!==undefined){st.readTry++;render();return;}
  if(d.addCurrent!==undefined){addWrong(current(),'朗读测试 · 手动标记');notify('已加入错题本。');return;}
  if(d.answer!==undefined&&!st.checked){st.picked=st.options[+d.answer];st.checked=true;record(st.picked===current()[st.direction==='zh'?0:1]);render();return;}
  if(d.pair){selectPair(d.pair);return;}
  if(d.dictMark!==undefined){toggleDictMark(Number(d.dictMark));return;}
  if(d.reviewMove){
    st.dictReviewIndex+=Number(d.reviewMove);
    st.notice='';
    render();
    return;
  }
  if(d.check!==undefined){go('result');return;}
  if(d.demo!==undefined){setRows([['name','名字'],['nice','友好的'],['hand','手']].map(([en,cn])=>({en,cn,include:true})));return;}
  if(d.import!==undefined){
    const rows=sanitizeRows();if(!rows.length){notify('请选择至少一个有效英文词。');return;}
    st.rows=rows;
    rows.forEach(w=>addWrong([w.en,w.cn],'拍照／手动导入'));
    st.wrongFilter='pending';
    if(st.photoBack==='setup'){
      st.source='wrong';
      st.selected=new Set(rows.map(w=>wordKey(w.en)));
      go('setup');
    }else go('wrong');
    notify('已加入 '+rows.length+' 个词。');return;
  }
  if(d.wrongfilter){st.wrongFilter=d.wrongfilter;render();return;}
  if(d.master!==undefined){const w=Object.values(wrong).filter(w=>w.mastered===(st.wrongFilter==='mastered'))[Number(d.master)];if(w){w.mastered=!w.mastered;save();render()}return;}
  if(d.retrain!==undefined){setup('translate','wrong');}
});
view.addEventListener('keydown',event=>{
  const tab=event.target.closest('.source-tabs [role="tab"]');
  if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  const tabs=[...tab.parentElement.querySelectorAll('[role="tab"]')];
  const index=tabs.indexOf(tab);
  const offset=event.key==='ArrowRight'?1:-1;
  const target=event.key==='Home'?tabs[0]:event.key==='End'?tabs.at(-1):tabs[(index+offset+tabs.length)%tabs.length];
  event.preventDefault();
  target.click();
});
view.addEventListener('change',event=>{
  const t=event.target,d=t.dataset;
  if(d.inlineBook){
    const [grade,term]=st.book.split('-');
    applyBook(d.inlineBook==='grade'?t.value+'-'+term:grade+'-'+t.value);
    render();
    view.querySelector(`[data-inline-book="${d.inlineBook}"]`)?.focus({preventScroll:true});
    return;
  }
  if(d.select!==undefined){
    const group=t.closest('[data-word-group]').dataset.wordGroup;
    if(t.checked)st.selected.add(d.select);else st.selected.delete(d.select);
    render();[...view.querySelectorAll(`[data-word-group="${group}"] [data-select]`)].find(el=>el.dataset.select===d.select)?.focus({preventScroll:true});
  }
  if(d.option){
    const wasPlaying=st.active;
    stop();
    st[d.option]=d.option==='dictMode'?t.value:Number(t.value);
    if(wasPlaying)st.notice='已暂停，修改后可继续报词。';
    render();
    view.querySelector(`[data-option="${d.option}"]`)?.focus({preventScroll:true});
  }
  if(d.readJump!==undefined){move(Number(t.value));view.querySelector('[data-read-jump]')?.focus({preventScroll:true});}
  if(d.translateMode!==undefined&&!st.checked){
    stop();
    st.direction=t.value;
    st.notice='';
    newQuestion();
    render();
    view.querySelector('[data-translate-mode]')?.focus({preventScroll:true});
  }
  if(d.gameMode!==undefined){
    stop();
    st.gameMode=t.value;
    st.pair=null;
    st.notice='';
    render();
    view.querySelector('[data-game-mode]')?.focus({preventScroll:true});
  }
  if(d.importInclude!==undefined)st.rows[+d.importInclude].include=t.checked;
  if(d.image!==undefined&&t.files[0]){
    const file=t.files[0];if(!file.type.startsWith('image/')){notify('请选择图片文件。');return;}
    if(st.photoUrl)URL.revokeObjectURL(st.photoUrl);
    st.photoUrl=URL.createObjectURL(file);notify('图片已在本机预览。可载入示例结果，或手动输入错词。');
  }
});
screenActions.addEventListener('change',event=>{
  if(event.target.hasAttribute('data-training-order'))st.order=event.target.value;
});
view.addEventListener('input',event=>{const t=event.target,d=t.dataset;if(d.editEn!==undefined)st.rows[+d.editEn].en=t.value;if(d.editCn!==undefined)st.rows[+d.editCn].cn=t.value;});
view.addEventListener('submit',event=>{
  if(!event.target.hasAttribute('data-manual'))return;
  event.preventDefault();const value=new FormData(event.target).get('words');
  const rows=value.split(/\r?\n/).map(line=>{const [raw,...parts]=line.trim().split(/[,，\t]/);return {en:raw.trim(),cn:parts.join('，').trim()||wordMap.get(raw.trim().toLowerCase())||'',include:true}}).filter(w=>validWord(w.en));
  if(rows.length)setRows(rows);else notify('请输入英文单词，每行一个。');
});
window.addEventListener('pagehide',clearReadAudio);
if(dictLayout||playerLayout){
  const previewHeader=document.querySelector('.preview-head');
  previewHeader.querySelector('h1').textContent=playerLayout==='reference'?'报听写 · 底部播放器':playerLayout?'报听写播放页方案':'报听写选词方案';
  previewHeader.querySelector('p').textContent=playerLayout?'用同一组 6 个词比较播放和核对，点开始才播报。':'切换方案，试试怎么选教材、单元和单词。';
  if(playerLayout)comparisonNav.setAttribute('aria-label','对比听写播放页方案');
  comparisonNav.hidden=false;
  renderComparisonNav();
  if(playerLayout){
    const preview=new URLSearchParams(location.search).get('state');
    showPlayerPreview(['setup','answer','finished','check','result'].includes(preview)?preview:'ready');
  }else{
    if(dictLayout==='cards')st.book=defaultBook;
    setup('dict');
  }
}else render();
</script></body></html>
